plugins {
    id 'com.android.application'
}

// The version comes from CI (the run number), so every build installs over the
// one before it. Locally it is 1 / 0.1.0-dev.
def runNumber = (System.getenv('CF_VERSION_CODE') ?: '1').toInteger()
def versionLabel = System.getenv('CF_VERSION_NAME') ?: '0.1.0-dev'

// Signing: a private keystore from the environment, else the public sideload
// key committed as base64 text (see docs/ANDROID.md, "Signing").
def keystoreFile
def keystorePassword
def keyAliasName
def keyPasswordValue
if (System.getenv('CF_KEYSTORE_B64')) {
    keystoreFile = new File(layout.buildDirectory.get().asFile, "release.jks")
    keystoreFile.parentFile.mkdirs()
    keystoreFile.bytes = System.getenv('CF_KEYSTORE_B64').decodeBase64()
    keystorePassword = System.getenv('CF_KEYSTORE_PASSWORD')
    keyAliasName = System.getenv('CF_KEY_ALIAS')
    keyPasswordValue = System.getenv('CF_KEY_PASSWORD')
} else {
    keystoreFile = new File(layout.buildDirectory.get().asFile, "sideload.jks")
    keystoreFile.parentFile.mkdirs()
    keystoreFile.bytes = file("${rootDir}/keystore/sideload.jks.b64").text.replaceAll('\\s', '').decodeBase64()
    keystorePassword = 'casefile-sideload'
    keyAliasName = 'casefile'
    keyPasswordValue = 'casefile-sideload'
}

android {
    namespace 'com.alkoda.casefile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alkoda.casefile'
        minSdk 24
        targetSdk 35
        versionCode runNumber
        versionName versionLabel
        resourceConfigurations += ['en', 'ar']
    }
    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keyPasswordValue
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX libraries pull in mixed kotlin-stdlib versions; the BOM aligns them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
